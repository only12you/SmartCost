const { useState, useMemo, useEffect, useRef } = React;
/* ---------- icons (inline SVG) ---------- */
const Icon = (inner) => ({ size = 24, className = '', strokeWidth = 2 }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true" dangerouslySetInnerHTML={{ __html: inner }} />
);
const Layers = Icon('<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>');

const Download = Icon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>');
const Copy = Icon('<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>');

const FileSpreadsheet = Icon('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2M14 13h2M8 17h2M14 17h2"/>');
const Share2 = Icon('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>');
const Sliders = Icon('<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/>');
const TrendingUp = Icon('<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>');
const ChevronRight = Icon('<path d="m9 18 6-6-6-6"/>');
const ArrowUpDown = Icon('<path d="m21 16-4 4-4-4M17 20V4M3 8l4-4 4 4M7 4v16"/>');

const SRC = {
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  h2c: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  tess: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
};
const loaded = {};
const loadScript = (src) => new Promise((res, rej) => {
  if (loaded[src]) return res();
  const s = document.createElement('script'); s.src = src;
  s.onload = () => { loaded[src] = 1; res(); }; s.onerror = () => rej(new Error('lib'));
  document.head.appendChild(s);
});

async function fileToText(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (['txt', 'csv', 'tsv', 'md'].includes(ext)) return await f.text();
  if (['xlsx', 'xls', 'xlsm'].includes(ext)) {
    await loadScript(SRC.xlsx);
    const wb = window.XLSX.read(await f.arrayBuffer(), { type: 'array' });
    return wb.SheetNames.map((s) => window.XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n');
  }
  if (ext === 'pdf') {
    await loadScript(SRC.pdf); window.pdfjsLib.GlobalWorkerOptions.workerSrc = SRC.pdfw;
    const pdf = await window.pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    let t = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 15); i++) { const c = await (await pdf.getPage(i)).getTextContent(); t += c.items.map((x) => x.str).join(' ') + '\n'; }
    return t;
  }
  if (ext === 'docx') { await loadScript(SRC.mammoth); return (await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value; }
  if (ext === 'pptx') {
    await loadScript(SRC.jszip); const z = await window.JSZip.loadAsync(await f.arrayBuffer()); let t = '';
    const names = Object.keys(z.files).filter((k) => /^ppt\/slides\/slide\d+\.xml$/.test(k));
    for (const k of names) { const x = await z.files[k].async('string'); t += (x.match(/<a:t>[^<]*<\/a:t>/g) || []).map((s) => s.replace(/<[^>]+>/g, '')).join(' ') + '\n'; }
    return t;
  }
  if ((f.type || '').startsWith('image/')) { await loadScript(SRC.tess); return (await window.Tesseract.recognize(f, 'kor+eng')).data.text; }
  throw new Error('unsupported');
}

function extract(t) {
  const o = {}; const s = t.replace(/\s+/g, ' '); let m;
  if ((m = s.match(/(?:고형분|solids?|SVR)[^0-9%]{0,25}?(\d{2,3}(?:\.\d+)?)\s*%/i))) o.svr = m[1];
  if ((m = s.match(/(\d+(?:\.\d+)?)\s*(?:㎡|m2|m²)\s*\/\s*(?:L|ℓ|l|리터)/i))) o.coverage = m[1];
  const tm = (re) => { const r = s.match(re); return r ? r[1] + (/분|min/i.test(r[2]) ? '분' : '시간') : null; };
  const d = tm(/(?:건조\s*시간|지촉|경화|dry(?:ing)?\s*time|touch\s*dry)[^0-9]{0,20}(\d+(?:\.\d+)?)\s*(시간|hrs?|h|분|min)/i); if (d) o.dryTime = d;
  const pl = tm(/(?:가사\s*시간|pot\s*life|사용\s*가능\s*시간)[^0-9]{0,20}(\d+(?:\.\d+)?)\s*(시간|hrs?|h|분|min)/i); if (pl) o.potLife = pl;
  if ((m = s.match(/(?:내열|heat\s*resist\w*|max\.?\s*temp\w*)[^0-9]{0,20}(\d{2,3})\s*(?:℃|°C|도)/i))) o.heat = m[1];
  if ((m = s.match(/(?:단가|가격|price)[^0-9]{0,15}(\d[\d,]{2,})/i))) o.price = m[1].replace(/,/g, '');
  const c = [...new Set((s.match(/KS\s?M\s?\d{4}(?:\s?\d종)?|ISO\s?\d{4,5}(?:-\d+)?|DNV(?:[-\s]?GL)?|ABS|KR\s?선급(?:인증)?|친환경[^,.;\s]{0,8}인증|HB\s?마크|NSF\s?\d+|UL\s?\d+|FM\s?\d+/gi) || []).map((x) => x.replace(/\s+/g, ' ').trim()))].slice(0, 8);
  if (c.length) o.certs = c.join(', ');
  return o;
}

const n = (v) => parseFloat(String(v == null ? '' : v).replace(/,/g, '')) || 0;
const list = (s) => String(s || '').split(/[,\n;]/).map((x) => x.trim()).filter(Boolean);
const covOf = (p) => n(p.coverage) || n(p.svr) / 10;
const uid = () => Math.random().toString(36).slice(2, 9);
const blankP = () => ({ id: uid(), name: '', company: '', svr: '', coverage: '', dryTime: '', potLife: '', heat: '', price: '', certs: '', tracks: '', file: null, ext: [] });
const CLABELS = ['기존 제품', '비교 A', '비교 B', '비교 C', '비교 D', '비교 E'];
const CCOL = ['#2563eb', '#ea580c', '#059669', '#7c3aed', '#e11d48', '#0891b2'];
const side = (p) => ({ name: p.name || '(제품명 미입력)', company: p.company || '-', svr: n(p.svr), coverage: covOf(p), dryTime: p.dryTime || '0시간', potLife: p.potLife || '0시간', heatResistance: (n(p.heat) || 0) + '℃', certifications: list(p.certs), tracks: list(p.tracks), unitPriceDefault: n(p.price) });
const loadCustom = () => { try { const r = JSON.parse(localStorage.getItem('cmp_custom_v4')); if (r && r.prods && r.prods.length > 1) return r; } catch (e) {} return { prods: [blankP(), blankP()], sel: 0, cmp: 1 }; };

// --- DATA DEFINITION (B2B Paint Data) ---
const PAIR_CATEGORIES = [];

function App() {
  const [darkMode, setDarkMode] = useState(false);
  const [selectedPairId, setSelectedPairId] = useState('custom');
  const [custom, setCustom] = useState(loadCustom);
  const [busy, setBusy] = useState('');
  const [openIdx, setOpenIdx] = useState(null);
  const tgt = useRef(0);
  const fileRef = useRef(null), camRef = useRef(null);
  useEffect(() => { try { localStorage.setItem('cmp_custom_v4', JSON.stringify({ ...custom, prods: custom.prods.map((p) => ({ ...p, file: p.file ? { name: p.file.name, kind: p.file.kind } : null })) })); } catch (e) {} }, [custom]);
  const [activeTab, setActiveTab] = useState('compare'); // compare, cost, proof, export
  
  // Cost Calculator Inputs
  const [area, setArea] = useState(5000); // 도장 면적 (㎡)
  const [lossRate, setLossRate] = useState(25); // 손실률 (%)
  const [targetDft, setTargetDft] = useState(100); // 목표 도막 두께 (㎛)
  
  // Dynamic Prices (allows custom B2B negotiated unit price)
  const [kccPrice, setKccPrice] = useState(18500);
  const [compPrice, setCompPrice] = useState(17200);

  // Current selected category pair
  const currentPair = useMemo(() => {
    if (selectedPairId === 'custom') {
      const b = custom.prods[0], c = custom.prods[custom.cmp] || custom.prods[1];
      return { id: 'custom', name: '데이터시트 직접 비교', kcc: side(c), comp: side(b) };
    }
    return PAIR_CATEGORIES.find(p => p.id === selectedPairId) || PAIR_CATEGORIES[0];
  }, [selectedPairId, custom]);

  // Update default prices when category changes
  useEffect(() => {
    setKccPrice(currentPair.kcc.unitPriceDefault);
    setCompPrice(currentPair.comp.unitPriceDefault);
  }, [selectedPairId, currentPair]);

  // --- Calculations ---
  // 실 소요량(L) = (면적 ㎡ * (목표DFT / 100)) / (이론도포면적 ㎡/L * (1 - 손실률/100))
  const calculations = useMemo(() => {
    const kccCoverageAdj = currentPair.kcc.coverage * (100 / targetDft);
    const compCoverageAdj = currentPair.comp.coverage * (100 / targetDft);

    const kccVolumeNeeded = (area / kccCoverageAdj) / (1 - lossRate / 100);
    const compVolumeNeeded = (area / compCoverageAdj) / (1 - lossRate / 100);

    const kccTotalCost = Math.round(kccVolumeNeeded * kccPrice);
    const compTotalCost = Math.round(compVolumeNeeded * compPrice);

    const costDiff = compTotalCost - kccTotalCost; // 양수면 KCC가 절감
    const savingPercent = compTotalCost > 0 ? ((costDiff / compTotalCost) * 100).toFixed(1) : 0;
    const volumeSaved = compVolumeNeeded - kccVolumeNeeded;

    return {
      kccVolumeNeeded: Math.ceil(kccVolumeNeeded),
      compVolumeNeeded: Math.ceil(compVolumeNeeded),
      kccTotalCost,
      compTotalCost,
      costDiff,
      savingPercent,
      volumeSaved: Math.ceil(volumeSaved)
    };
  }, [area, lossRate, targetDft, kccPrice, compPrice, currentPair]);

  // Share Modal & Toast
  const [toastMessage, setToastMessage] = useState('');

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(''), 2500);
  };

  const labels12 = () => (selectedPairId === 'custom' ? ['비교 제품', '기존 제품'] : [currentPair.kcc.company, currentPair.comp.company]);
  const summaryText = () => {
    const c = calculations, cp = currentPair, [l1, l2] = labels12();
    return '[B2B 도료 사양 & 견적비교]\n조건: 면적 ' + area.toLocaleString() + '㎡ · 손실률 ' + lossRate + '% · 목표 DFT ' + targetDft + '㎛\n' + l1 + ': ' + cp.kcc.name + ' — ' + c.kccVolumeNeeded.toLocaleString() + 'L · ' + c.kccTotalCost.toLocaleString() + '원\n' + l2 + ': ' + cp.comp.name + ' — ' + c.compVolumeNeeded.toLocaleString() + 'L · ' + c.compTotalCost.toLocaleString() + '원\n' + l2 + ' 대비 ' + l1 + ' 자재비 ' + (c.costDiff >= 0 ? '절감 ' : '증가 ') + Math.abs(c.costDiff).toLocaleString() + '원 (' + Math.abs(c.savingPercent) + '%)\n※ 참고용 자료이며 시공 전 최신 TDS를 확인하세요.';
  };
  const handleCopyLink = async () => {
    const t = summaryText();
    try { if (navigator.share) { await navigator.share({ title: 'B2B 도료 사양 & 견적비교', text: t }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(t); showToast('비교 요약이 클립보드에 복사되었습니다.'); } catch (e) { showToast('복사하지 못했습니다.'); }
  };
  const handleExportExcel = async () => {
    const c = calculations, cp = currentPair, k = cp.kcc, m = cp.comp, [l1, l2] = labels12();
    const aoa = [['B2B 도료 사양 & 견적비교 보고서'], ['도장 면적(㎡)', area, '손실률(%)', lossRate, '목표 DFT(㎛)', targetDft], [], ['항목', l1, l2],
      ['제품명', k.name, m.name], ['제조사', k.company, m.company], ['고형분 SVR(%)', k.svr, m.svr], ['이론 도포면적(㎡/L)', k.coverage, m.coverage], ['건조시간', k.dryTime, m.dryTime], ['가사시간', k.potLife, m.potLife], ['내열온도', k.heatResistance, m.heatResistance],
      ['단가(원/L)', kccPrice, compPrice], ['실 소요량(L)', c.kccVolumeNeeded, c.compVolumeNeeded], ['총 자재비(원)', c.kccTotalCost, c.compTotalCost], ['절감액(원, +면 ' + l1 + ' 저렴)', c.costDiff, ''], ['절감률(%)', c.savingPercent, ''],
      ['인증서', k.certifications.join(', '), m.certifications.join(', ')], ['시공 실적', k.tracks.join(', '), m.tracks.join(', ')]];
    try {
      await loadScript(SRC.xlsx); const X = window.XLSX; const wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(aoa), '비교보고서'); X.writeFile(wb, '도료비교보고서.xlsx'); showToast('엑셀(.xlsx) 보고서를 저장했습니다.');
    } catch (e) {
      const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const blob = new Blob(['\ufeff' + aoa.map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '도료비교보고서.csv'; document.body.appendChild(a); a.click(); a.remove(); showToast('엑셀 라이브러리를 불러오지 못해 CSV로 저장했습니다.');
    }
  };
  const handleExportPDF = async () => {
    try {
      showToast('PDF 생성 중…'); setActiveTab('export'); await new Promise((r) => setTimeout(r, 350));
      await loadScript(SRC.h2c); await loadScript(SRC.jspdf);
      const el = document.querySelector('main');
      const cv = await window.html2canvas(el, { scale: 2, backgroundColor: darkMode ? '#111827' : '#ffffff', useCORS: true });
      const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4'); const w = 210, h = cv.height * w / cv.width, img = cv.toDataURL('image/jpeg', 0.92);
      for (let y = 0, i = 0; y < h; y += 297, i++) { if (i) pdf.addPage(); pdf.addImage(img, 'JPEG', 0, -y, w, h); }
      pdf.save('도료비교보고서.pdf'); showToast('PDF 보고서를 저장했습니다.');
    } catch (e) { try { window.print(); } catch (x) { showToast('PDF를 만들지 못했습니다. 네트워크를 확인해 주세요.'); } }
  };

  async function onFile(e) {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    const isImg = (f.type || '').startsWith('image/'); const si = tgt.current;
    const meta = { name: f.name, kind: isImg ? 'image' : 'file', url: isImg ? URL.createObjectURL(f) : '' };
    const put = (patch) => setCustom((c) => ({ ...c, prods: c.prods.map((p, j) => (j === si ? { ...p, ...patch } : p)) }));
    put({ file: meta }); setBusy(isImg ? '이미지 글자 인식 중… (처음엔 시간이 걸릴 수 있어요)' : '데이터시트 분석 중…');
    try {
      const o = extract(await fileToText(f)); const keys = Object.keys(o);
      put({ ...o, name: custom.prods[si].name || f.name.replace(/\.[^.]+$/, ''), ext: keys });

                    min="500" 
                    max="50000" 
                    step="500"
                    value={area} 
                    onChange={(e) => setArea(Number(e.target.value))}
                    className="w-full accent-blue-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] text-gray-400">
                    <span>500 ㎡ (소형)</span>
                    <span>10,000 ㎡ (중형)</span>
                    <span>50,000 ㎡ (대형 플랜트)</span>
                  </div>
                </div>

                {/* Loss Rate Input */}
                <div className="space-y-1 pt-1">
                  <div className="flex justify-between text-xs">
                    <label className="font-bold text-gray-700 dark:text-gray-300">현장 로스율 (Loss %)</label>
                    <span className="font-extrabold text-blue-600">{lossRate}%</span>
                  </div>
                  <input 
                    type="range" 
                    min="5" 
                    max="50" 
                    step="5"
                    value={lossRate} 
                    onChange={(e) => setLossRate(Number(e.target.value))}
                    className="w-full accent-blue-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[9px] text-gray-400">
                    <span>5% (붓/롤러 도장)</span>
                    <span>25% (일반 스프레이)</span>
                    <span>50% (고소 야외스프레이)</span>
                  </div>
                </div>

                {/* Target DFT Input */}
                <div className="space-y-1 pt-1">
                  <div className="flex justify-between text-xs">
                    <label className="font-bold text-gray-700 dark:text-gray-300">목표 건조 도막두께 (DFT ㎛)</label>
                    <span className="font-extrabold text-blue-600">{targetDft} ㎛</span>
                  </div>
                  <input 
                    type="range" 
                    min="50" 
                    max="300" 
                    step="25"
                    value={targetDft} 
                    onChange={(e) => setTargetDft(Number(e.target.value))}
                    className="w-full accent-blue-600 cursor-pointer"
                  />
                </div>

                {/* Unit Price Inputs */}
                <div className="pt-2 grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[10px] font-bold text-blue-600 dark:text-blue-400 block mb-1">
                      KCC 단가 (원/L)
                    </label>
                    <input 
                      type="number" 
                      value={kccPrice}
                      onChange={(e) => setKccPrice(Number(e.target.value))}
                      className="w-full bg-gray-50 dark:bg-gray-900 border border-blue-300 dark:border-blue-800 rounded-lg p-2 text-xs font-bold text-blue-900 dark:text-blue-100 text-right focus:outline-none focus:ring-1 focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-gray-500 block mb-1">
                      타사 단가 (원/L)
                    </label>
                    <input 
                      type="number" 
                      value={compPrice}
                      onChange={(e) => setCompPrice(Number(e.target.value))}
                      className="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg p-2 text-xs font-bold text-gray-800 dark:text-gray-200 text-right focus:outline-none focus:ring-1 focus:ring-blue-500"
                    />
                  </div>
                </div>
              </div>

              {/* Simulation Calculation Results Card */}
              <div className="bg-gradient-to-br from-blue-900 to-slate-900 text-white rounded-2xl p-4 shadow-lg space-y-4">
                <div className="flex justify-between items-center border-b border-blue-800/80 pb-2">
                  <span className="text-xs font-extrabold text-blue-300 flex items-center gap-1">
                    <Calculator size={14} /> 최종 LCC 비용 산출 결과
                  </span>
                  <span className="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-bold">
                    실시간 자동계산
                  </span>
                </div>

                {/* Big ROI Savings Number */}
                <div className="text-center py-2 bg-white/5 rounded-xl border border-white/10">
                  <span className="text-[11px] text-gray-300 block mb-1">KCC 도입 시 예상 비용 절감액</span>
                  <div className="text-2xl font-black text-emerald-400 tracking-tight">
                    {calculations.costDiff > 0 ? (
                      `₩ ${calculations.costDiff.toLocaleString()} 원 절감`
                    ) : (
                      `₩ ${Math.abs(calculations.costDiff).toLocaleString()} 원 추가`
                    )}
                  </div>
                  <p className="text-[10px] text-emerald-300/80 mt-1 font-semibold">
                    {calculations.costDiff > 0 ? `(타사 대비 약 ${calculations.savingPercent}% 총액 절감 효과)` : '단가 재협상 필요'}
                  </p>
                </div>

                {/* Comparison Details Grid */}
                <div className="grid grid-cols-2 gap-2 text-xs pt-1">
                  {/* KCC Result */}
                  <div className="bg-blue-950/60 border border-blue-700/50 p-2.5 rounded-xl space-y-1">
                    <div className="text-[10px] font-bold text-blue-400">KCC 소요 사양</div>
                    <div className="flex justify-between text-[11px]">
                      <span className="text-gray-400">필요 도료:</span>
                      <strong className="text-white">{calculations.kccVolumeNeeded.toLocaleString()} L</strong>
                    </div>
                    <div className="flex justify-between text-[11px]">
                      <span className="text-gray-400">총 자재비:</span>
                      <strong className="text-blue-300">{(calculations.kccTotalCost / 10000).toFixed(0)} 만원</strong>
                    </div>
                  </div>

                  {/* Competitor Result */}
                  <div className="bg-gray-800/60 border border-gray-700/50 p-2.5 rounded-xl space-y-1">
                    <div className="text-[10px] font-bold text-gray-400">타사 소요 사양</div>
                    <div className="flex justify-between text-[11px]">
                      <span className="text-gray-400">필요 도료:</span>
                      <strong className="text-gray-200">{calculations.compVolumeNeeded.toLocaleString()} L</strong>
                    </div>
                    <div className="flex justify-between text-[11px]">
                      <span className="text-gray-400">총 자재비:</span>
                      <strong className="text-gray-300">{(calculations.compTotalCost / 10000).toFixed(0)} 만원</strong>
                    </div>
                  </div>
                </div>

                {/* Key Insight */}
                <div className="text-[10px] text-gray-300 bg-blue-900/40 p-2 rounded-lg leading-snug border border-blue-700/30">
                  💡 <strong>리터당 단가가 높더라도</strong> KCC의 높 고형분(SVR {currentPair.kcc.svr}%) 특성으로 
                  총 필요 도료량이 <strong>{calculations.volumeSaved.toLocaleString()} 리터 절감</strong>되어 
                  최종 견적이 훨씬 유리합니다.
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: PROOF & CERTIFICATIONS LEDGER */}
          {ready && activeTab === 'proof' && (
            <div className="space-y-4 animate-fadeIn">
              {/* Proof Title Banner */}
              <div className="bg-slate-900 text-white p-3.5 rounded-xl flex items-center justify-between shadow-sm">
                <div>
                  <h3 className="text-xs font-black flex items-center gap-1.5 text-blue-400">
                    <ShieldCheck size={16} /> 공인 검증 & 납품 실적 레저
                  </h3>
                  <p className="text-[10px] text-gray-300">데이터시트 외 객관적 품질 인증 증빙</p>
                </div>
                <Award className="text-amber-400" size={24} />
              </div>

              {/* Certifications List */}
              <div className="bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl p-3.5 space-y-3">
                <h4 className="text-xs font-bold text-gray-900 dark:text-white flex items-center gap-1">
                  <CheckCircle2 size={14} className="text-emerald-500" /> 보유 공인 인증 (Certifications)
                </h4>
                
                <div className="space-y-2">
                  {currentPair.kcc.certifications.map((cert, idx) => (
                    <div key={idx} className="flex items-center justify-between p-2 rounded-lg bg-gray-50 dark:bg-gray-900 border border-gray-100 dark:border-gray-800">
                      <div className="flex items-center gap-2">
                        <span className="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
                        <span className="text-xs font-bold text-gray-800 dark:text-gray-200">{cert}</span>
                      </div>
                      <span className="text-[10px] font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/60 px-2 py-0.5 rounded">
                        인증 획득 완료
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Key B2B Project Track Record */}
              <div className="bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl p-3.5 space-y-3">
                <h4 className="text-xs font-bold text-gray-900 dark:text-white flex items-center gap-1">
                  <Building2 size={14} className="text-blue-500" /> 대형 랜드마크 & B2B 납품 실적
                </h4>

                <div className="space-y-2">
                  {currentPair.kcc.tracks.map((track, idx) => (
                    <div key={idx} className="p-2.5 rounded-xl bg-blue-50/40 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/40 flex items-center gap-2.5">
                      <div className="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center shrink-0 font-bold text-xs">
                        {idx + 1}
                      </div>
                      <div>
                        <div className="text-xs font-extrabold text-gray-900 dark:text-gray-100">{track}</div>
                        <div className="text-[10px] text-gray-500 dark:text-gray-400">KCC 최고급 산업용 사양 적용 완료 현장</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Quality Guarantee Note */}
              <div className="bg-gray-50 dark:bg-gray-800 p-3 rounded-xl border border-gray-200 dark:border-gray-700 text-center space-y-1">
                <p className="text-[11px] font-bold text-gray-700 dark:text-gray-300">
                  전 세계 주요 선급(DNV, KR, ABS) 및 국방 사양 승인
                </p>
                <p className="text-[10px] text-gray-500 dark:text-gray-400">
                  KCC 중앙연구소 시험성적서 즉시 발급 가능
                </p>
              </div>
            </div>
          )}

          {/* TAB 4: EXPORT & REPORT SUITE */}
          {ready && activeTab === 'export' && (
            <div className="space-y-4 animate-fadeIn">
              <div className="bg-white dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-xl p-4 space-y-3">
                <h3 className="text-xs font-extrabold text-gray-900 dark:text-white border-b border-gray-100 dark:border-gray-700 pb-2">
                  B2B 보고서 및 견적서 내보내기
                </h3>
                <p className="text-[11px] text-gray-500 dark:text-gray-400 leading-relaxed">
                  작성된 사양 비교 결과 및 단가 절감 시뮬레이션 데이터를 다양한 B2B 업무용 포맷으로 내보낼 수 있습니다.
                </p>

                <div className="space-y-2 pt-1">
                  {/* PDF Export Button */}
                  <button 
                    onClick={handleExportPDF}
                    className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl p-3 text-xs font-bold flex items-center justify-between shadow-md transition active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-2.5">
                      <FileText size={18} />
                      <div className="text-left">
                        <div>기술 사양 비교 보고서 (PDF)</div>
                        <div className="text-[9px] font-normal text-blue-200">1:1 성능 비교 및 시험성적서 첨부형</div>
                      </div>
                    </div>
                    <Download size={16} />
                  </button>

                  {/* Excel Cost Sheet Button */}
                  <button 
                    onClick={handleExportExcel}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl p-3 text-xs font-bold flex items-center justify-between shadow-md transition active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-2.5">
                      <FileSpreadsheet size={18} />
                      <div className="text-left">
                        <div>B2B 도료 일위대가 산출서 (Excel)</div>
                        <div className="text-[9px] font-normal text-emerald-200">면적별 소요 수량 및 견적 수식 포함</div>
                      </div>
                    </div>
                    <Download size={16} />
                  </button>

                  {/* Share Link Button */}
                  <button 
                    onClick={handleCopyLink}
                    className="w-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 rounded-xl p-3 text-xs font-bold flex items-center justify-between transition border border-gray-200 dark:border-gray-600"
                  >
                    <div className="flex items-center gap-2.5">
                      <Share2 size={18} />
                      <div className="text-left">
                        <div>카카오톡 / 웹 링크 공유</div>
                        <div className="text-[9px] font-normal text-gray-500 dark:text-gray-400">현재 계산 조건 그대로 공유</div>
                      </div>
                    </div>
                    <Copy size={16} />
                  </button>
                </div>
              </div>

              {/* Summary Preview Box */}
              <div className="bg-gray-50 dark:bg-gray-900/60 rounded-xl p-3.5 border border-gray-200 dark:border-gray-800 space-y-2">
                <div className="text-[11px] font-extrabold text-gray-700 dark:text-gray-300">
                  📋 내보내기 요약 프리뷰
                </div>
                <div className="text-[10px] space-y-1 text-gray-600 dark:text-gray-400 font-mono bg-white dark:bg-gray-800 p-2.5 rounded-lg border border-gray-100 dark:border-gray-700">
                  <div>• 제품: {currentPair.kcc.name}</div>
                  <div>• 면적/DFT: {area.toLocaleString()}㎡ / {targetDft}㎛ (손실률 {lossRate}%)</div>
                  <div>• KCC 총 도료 소요량: {calculations.kccVolumeNeeded.toLocaleString()} L</div>
                  <div>• 예상 총 절감액: ₩ {calculations.costDiff.toLocaleString()} 원 ({calculations.savingPercent}%)</div>
                </div>
              </div>
            </div>
          )}

        </main>

        {/* Toast Popup Notification */}
        {toastMessage && (
          <div className="absolute bottom-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 border border-gray-700 animate-bounce z-50">
            <CheckCircle2 size={14} className="text-emerald-400" />
            <span>{toastMessage}</span>
          </div>
        )}

        {/* Bottom Navigation Bar */}
        <nav className="fixed bottom-0 w-full max-w-[900px] bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 shadow-[0_-8px_22px_rgba(40,90,170,0.10)] rounded-t-[18px] grid grid-cols-4 gap-1 z-40 noprint" style={{ padding: '3px 6px calc(3px + env(safe-area-inset-bottom, 0px))' }}>
          {[{ id: 'compare', label: '사양비교', Ico: Layers }, { id: 'cost', label: 'LCC/견적', Ico: Calculator }, { id: 'proof', label: '검증/실적', Ico: ShieldCheck }, { id: 'export', label: '보고서', Ico: FileText }].map(({ id, label, Ico }) => {
            const on = activeTab === id;
            return (
              <button key={id} onClick={() => setActiveTab(id)} aria-label={label} title={label}
                className={'flex flex-col items-center justify-center gap-px rounded-[10px] transition active:scale-95 ' + (on ? 'text-white shadow-md' : 'text-gray-400 dark:text-gray-500')}
                style={{ height: 40, padding: '3px 0 2px', background: on ? 'linear-gradient(180deg,#1c58e0,#0b3fc0)' : 'transparent' }}>
                <Ico size={20} strokeWidth={on ? 2.3 : 2} />
                <span style={{ fontSize: 10, fontWeight: 700, lineHeight: 1.1, whiteSpace: 'nowrap' }}>{label}</span>
              </button>);
          })}
        </nav>

      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
